name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Both platforms, because the point of the split backends is that neither
    # is the only one.  The suite is offline, so no emulator is needed.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,fast]"
      - run: pytest -q
      - name: the server starts and lists its tools
        run: python -c "import asyncio,dosbox_mcp.server as s; print(len(asyncio.run(s.mcp.list_tools())), 'tools')"
