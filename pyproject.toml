[project]
name = "dosbox-mcp"
version = "0.1.0"
description = "MCP server for driving a DOSBox-X guest headlessly: keys, clicks, memory and exact frame capture"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "pillow>=10",
    "pydantic>=2",
]

[project.scripts]
dosbox-mcp = "dosbox_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dosbox_mcp"]
